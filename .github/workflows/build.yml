name: Build custom APK

on:
  push:
    branches: [custom-build]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache Mysterium node AAR
        uses: actions/cache@v4
        with:
          path: android/libs
          key: node-aar-${{ hashFiles('android/gradle/libs.versions.toml') }}

      - name: Write signing config
        working-directory: android
        run: |
          cat > local.properties << EOF
          releaseStoreFile=keystore/release.keystore
          releaseStorePassword=mystnodes2026
          releaseKeyAlias=mystnodes
          releaseKeyPassword=mystnodes2026
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK integrity
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi

          APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH")
          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK file is suspiciously small (< 1MB), may be corrupted"
            exit 1
          fi

          echo "APK integrity check passed"

      - name: Upload APK as GitHub Artifact (ZIP)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mystnodes-custom-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          compression-level: 6
